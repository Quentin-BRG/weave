[package]
name = "weave"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
license = "MPL-2.0"
description = "Weave — a lightweight real-time collaboration layer above Git"
repository = "https://github.com/Quentin-BRG/weave"
readme = "README.md"
keywords = ["collaboration", "git", "realtime", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "weave"
path = "src/lib.rs"

[[bin]]
name = "weave"
path = "src/main.rs"

[profile.release]
opt-level = 2
debug = false
strip = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.5.61", features = ["derive", "env"] }
dirs = "6.0.0"
futures-util = "0.3.34"
notify = "8.2.0"
rand = "0.9.5"
rpassword = "7.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process", "signal", "net"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
